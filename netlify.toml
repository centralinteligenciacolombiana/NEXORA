# Netlify — Next.js 15 (App Router + OpenNext runtime)
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-fund --no-audit"
  # Evita sorpresas si faltan vars en el build; se validan en runtime.
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
